<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendário UJ</title><style>
:root{color-scheme:dark;--blue:#1686d2;--red:#DC2626;--wine:#8B1E3F}*{box-sizing:border-box}body{margin:0;padding:16px;background:#191919;color:#f5f5f5;font:15px system-ui,sans-serif}.calendar{max-width:440px;margin:auto;padding:24px;border:1px solid #383838;border-radius:20px;background:#202020;border-top:4px solid #00549F}.label{font-size:10px;letter-spacing:3px;color:#9b9b9b;font-weight:700}header{display:flex;align-items:center;justify-content:space-between;margin:14px 0 24px}h1{font-size:25px;margin:0;text-transform:capitalize;letter-spacing:-1px}button{border:1px solid #444;background:transparent;color:inherit;cursor:pointer;border-radius:9px;padding:7px 11px;font:inherit}button:hover{background:#353535}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.nav{display:flex;gap:6px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{font-size:10px;font-weight:750;color:#9da4ac;margin-bottom:12px}.day{display:grid;place-items:center;min-height:39px;border-radius:10px;font-variant-numeric:tabular-nums}.outside{color:#606060}.weekend:not(.outside){color:#f08b9e}.today{background:var(--red);color:white!important;font-weight:800;box-shadow:0 3px 14px #dc262630}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #383838;padding-top:16px;margin-top:20px}.date{color:#bababa;font-size:11px}.footer button{color:#7bbce9;font-size:11px;border-color:#00549F}.dot{display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:6px}@media(max-width:340px){body{padding:5px}.calendar{padding:16px}.day{min-height:32px}h1{font-size:21px}}
</style><style>
body{padding:4px;font-size:12px}.calendar{max-width:300px;padding:13px;border-radius:14px;border-top-width:3px}.label{font-size:8px;letter-spacing:2px}header{margin:9px 0 14px}h1{font-size:19px;letter-spacing:-.5px}.nav{gap:4px}button{padding:3px 8px;border-radius:6px}.grid{gap:3px}.week{font-size:8px;margin-bottom:7px}.day{min-height:27px;border-radius:7px}.footer{padding-top:10px;margin-top:12px;gap:6px}.date{font-size:9px}.footer button{font-size:9px;padding:4px 6px}@media(max-width:260px){.calendar{padding:9px}h1{font-size:16px}.day{min-height:24px}.label{font-size:7px}.date{font-size:8px}.footer button{font-size:8px}}
</style><main class="calendar" aria-label="Calendário mensal"><div class="label">CALENDÁRIO</div><header><h1 id="month" aria-live="polite"></h1><div class="nav"><button id="prev" aria-label="Mês anterior">‹</button><button id="next" aria-label="Próximo mês">›</button></div></header><div class="grid week" aria-hidden="true"><span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span></div><div class="grid" id="days"></div><div class="footer"><span class="date" id="date"></span><button id="reset">Voltar para hoje</button></div></main><script>
const parts=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()).reduce((a,p)=>(a[p.type]=p.value,a),{});let p=parts(),today=new Date(+p.year,+p.month-1,+p.day),view=new Date(today.getFullYear(),today.getMonth(),1);function render(){document.getElementById('month').textContent=view.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const grid=document.getElementById('days');grid.replaceChildren();let start=new Date(view.getFullYear(),view.getMonth(),1-view.getDay());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let e=document.createElement('div');const current=d.toDateString()===today.toDateString();e.className='day'+(d.getMonth()!==view.getMonth()?' outside':'')+([0,6].includes(d.getDay())?' weekend':'')+(current?' today':'');e.textContent=d.getDate();e.setAttribute('aria-label',d.toLocaleDateString('pt-BR',{dateStyle:'full'}));if(current)e.setAttribute('aria-current','date');grid.append(e)}document.getElementById('date').textContent='Hoje · '+today.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'});}document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};document.getElementById('reset').onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);render()};render();setInterval(()=>{let q=parts();today=new Date(+q.year,+q.month-1,+q.day);render()},60000);
</script></html>
